[package]
name = "kfbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cue tracks by rules and hand them to rekordbox."

[lib]
name = "kfbox_lib"
# The desktop binary links the rlib. Tauri's template adds a staticlib and a
# cdylib for iOS and Android, which kfbox doesn't target: each was a second
# and third link of the whole app on every build.
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
kfbox-core = { path = "../crates/kfbox-core" }
kfbox-assist = { path = "../crates/kfbox-assist" }
rbl-deck = { workspace = true }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
rbl-db = { workspace = true }
