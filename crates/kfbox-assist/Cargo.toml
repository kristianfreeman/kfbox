[package]
name = "kfbox-assist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "kfbox's LLM quick functions and rules wizard: the model uses kfbox's own commands as tools."

[lints]
workspace = true

[dependencies]
kfbox-core = { path = "../kfbox-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The API key lives in the macOS Keychain and nowhere else.
keyring = { version = "3", features = ["apple-native"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
rbl-db = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# For asking whether the key is there by its attributes alone, which neither
# decrypts it nor asks the person for Keychain access.
security-framework = "3"
